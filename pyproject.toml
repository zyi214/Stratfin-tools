[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stratfin-tools"
version = "0.1.0"
description = "Multi-agent strategic finance assistant powered by Claude — built for hardware startups"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.49.0",
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "numpy>=1.26.0",
    "numpy-financial>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
stratfin = "stratfin.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["stratfin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
