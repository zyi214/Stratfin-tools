    function ScenariosPage({ scenarios, activeScenario, addScenario, deleteScenario, setActiveScenarioId }) {
      const breakdowns = scenarios.map(s => ({
        id: s.id,
        name: s.name,
        config: s.config,
        breakdown: calculateCosts(s.config, s.inputs)
      }));

      const cpuChartData = [{
        name: "CPU",
        ...Object.fromEntries(breakdowns.map(b => [b.name, parseFloat(b.breakdown.totalCost.toFixed(2))]))
      }];

      const marginChartData = [{
        name: "Margin %",
        ...Object.fromEntries(breakdowns.map(b => [b.name, parseFloat((b.breakdown.grossMarginPercent * 100).toFixed(2))]))
      }];

      return (
        <div className="space-y-6 animate-[fadeIn_0.2s_ease-out]">
          <div className="flex items-center justify-between">
            <div>
              <h1 className="text-2xl font-bold tracking-tight">Scenario Comparison</h1>
              <p className="text-xs text-muted-foreground mt-1">Compare up to 4 costing scenarios side-by-side.</p>
            </div>
            {scenarios.length < 4 && (
              <button
                onClick={() => addScenario({ name: `Scenario ${scenarios.length + 1}`, config: { ...activeScenario.config }, inputs: { ...defaultInputs } })}
                className="flex items-center gap-1.5 text-xs bg-primary text-primary-foreground px-3 py-1.5 rounded hover:opacity-90 transition-opacity font-semibold cursor-pointer"
              >
                <Icon name="plus" className="w-3.5 h-3.5" /> Add Scenario
              </button>
            )}
          </div>

          {/* Cards */}
          <div className="grid grid-cols-4 gap-4">
            {scenarios.map(s => {
              const bd = calculateCosts(s.config, s.inputs);
              const isActive = s.id === activeScenario.id;
              return (
                <div
                  key={s.id}
                  onClick={() => setActiveScenarioId(s.id)}
                  className={`bg-card border rounded-lg p-4 cursor-pointer transition-all ${isActive ? "border-primary ring-1 ring-primary" : "border-card-border hover:border-border"}`}
                >
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-sm font-bold text-foreground truncate block max-w-[130px]">{s.name}</span>
                    {!s.isBaseCase && (
                      <button onClick={(e) => { e.stopPropagation(); deleteScenario(s.id); }} className="text-muted-foreground hover:text-red-400"><Icon name="trash" className="w-3.5 h-3.5" /></button>
                    )}
                  </div>
                  <div className="text-xs text-muted-foreground mb-2 truncate">{s.config.name}</div>
                  <div className="text-lg font-bold text-foreground">${formatNumber(bd.totalCost)}</div>
                  <div className={`text-xs font-semibold ${bd.grossMarginPercent >= 0.3 ? "text-green-400" : "text-yellow-400"}`}>
                    {(bd.grossMarginPercent * 100).toFixed(1)}% margin
                  </div>
                </div>
              );
            })}
          </div>

          {/* Charts Row */}
          <div className="grid grid-cols-2 gap-4">
            <div className="bg-card border border-card-border rounded-lg p-5">
              <h3 className="text-xs font-semibold uppercase tracking-wider text-muted-foreground mb-4">Cost Per Unit</h3>
              <div className="h-32">
                <ResponsiveContainer width="100%" height="100%">
                  <BarChart data={cpuChartData}>
                    <XAxis dataKey="name" hide />
                    <YAxis width={40} tickFormatter={v => `$${v}`} tick={{ fontSize: 10, fill: "hsl(210,14%,52%)" }} />
                    <Tooltip formatter={v => [`$${formatNumber(v)}`]} contentStyle={{ background: "hsl(222,26%,12%)", border: "1px solid hsl(222,20%,18%)" }} />
                    <Legend wrapperStyle={{ fontSize: 10 }} />
                    {scenarios.map((s, idx) => (
                      <Bar key={s.id} dataKey={s.name} fill={["hsl(210,90%,56%)", "hsl(38,90%,52%)", "hsl(142,70%,42%)", "hsl(262,52%,62%)"][idx % 4]} radius={[3, 3, 0, 0]} />
                    ))}
                  </BarChart>
                </ResponsiveContainer>
              </div>
            </div>
            <div className="bg-card border border-card-border rounded-lg p-5">
              <h3 className="text-xs font-semibold uppercase tracking-wider text-muted-foreground mb-4">Gross Margin %</h3>
              <div className="h-32">
                <ResponsiveContainer width="100%" height="100%">
                  <BarChart data={marginChartData}>
                    <XAxis dataKey="name" hide />
                    <YAxis width={40} tickFormatter={v => `${v}%`} tick={{ fontSize: 10, fill: "hsl(210,14%,52%)" }} />
                    <Tooltip formatter={v => [`${v}%`]} contentStyle={{ background: "hsl(222,26%,12%)", border: "1px solid hsl(222,20%,18%)" }} />
                    <Legend wrapperStyle={{ fontSize: 10 }} />
                    {scenarios.map((s, idx) => (
                      <Bar key={s.id} dataKey={s.name} fill={["hsl(210,90%,56%)", "hsl(38,90%,52%)", "hsl(142,70%,42%)", "hsl(262,52%,62%)"][idx % 4]} radius={[3, 3, 0, 0]} />
                    ))}
                  </BarChart>
                </ResponsiveContainer>
              </div>
            </div>
          </div>

          {/* Comparison Matrix Table */}
          <div className="bg-card border border-card-border rounded-lg overflow-hidden">
            <table className="w-full text-xs text-left">
              <thead>
                <tr className="border-b border-border bg-muted/10">
                  <th className="py-2.5 px-4 font-semibold text-muted-foreground uppercase tracking-wider w-40">Cost Line Item</th>
                  {breakdowns.map(b => (
                    <th key={`table-head-${b.id}`} className="py-2.5 px-4 font-semibold text-foreground text-right">{b.name}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {[
                  { key: "materials", label: "Materials" },
                  { key: "labor", label: "Labor" },
                  { key: "overhead", label: "Overhead" },
                  { key: "tooling", label: "Tooling" },
                  { key: "yieldLoss", label: "Yield Loss" },
                  { key: "packaging", label: "Packaging" },
                  { key: "logistics", label: "Logistics" },
                  { key: "warranty", label: "Warranty" },
                  { key: "totalCost", label: "Total Cost (CPU)" },
                  { key: "grossMarginPercent", label: "Gross Margin %" }
                ].map(metric => (
                  <tr key={`table-row-${metric.key}`} className="border-b border-border/40 hover:bg-muted/5 transition-colors">
                    <td className="py-2.5 px-4 text-muted-foreground">{metric.label}</td>
                    {breakdowns.map(b => {
                      const v = b.breakdown[metric.key];
                      const display = metric.key === "grossMarginPercent" ? `${(v * 100).toFixed(1)}%` : `$${formatNumber(v)}`;
                      return (
                        <td key={`table-val-${b.id}-${metric.key}`} className="py-2.5 px-4 text-right stat-value font-semibold text-foreground">
                          {display}
                        </td>
                      );
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {/* Methodology Explanation */}
          <div className="bg-card/40 border border-border/60 rounded-lg p-5 mt-6 flex gap-3 text-xs leading-relaxed">
            <div className="text-primary mt-0.5"><Icon name="info" className="w-4 h-4" /></div>
            <div>
              <h4 className="font-bold text-foreground mb-1">Methodology: Scenario Comparison</h4>
              <p className="text-muted-foreground">
                This screen compiles all saved scenarios in your browser's local state and aligns their unit cost components side-by-side in a comparative matrix. This allows you to evaluate how shifting from simple to detailed granularity, changing vendors, or making operational adjustments impacts each cost line item (such as materials, labor, overhead, yield loss, and warranty) as well as the final gross margins.
              </p>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────────────────────
    // Make vs Buy Component
    // ─────────────────────────────────────────────────────────────────────────

    function MakeVsBuyPage({ scenarios, addScenario, setActiveScenarioId }) {
      const defaultBuy = scenarios.find(s => s.id === "ultrasound_probe_buy") || scenarios[0];
      const defaultMake = scenarios.find(s => s.id === "base") || scenarios[0];

      const [buyId, setBuyId] = useState(defaultBuy?.id || null);
      const [makeId, setMakeId] = useState(defaultMake?.id || null);

      const buyScenario = scenarios.find(s => s.id === buyId);
      const makeScenario = scenarios.find(s => s.id === makeId);

      const analysis = useMemo(() => {
        if (!buyScenario || !makeScenario) return null;
        return makevsBuyAnalysis(buyScenario.config, buyScenario.inputs, makeScenario.config, makeScenario.inputs);
      }, [buyScenario, makeScenario]);

      const createDefaultScenario = (role) => {
        const id = addScenario({
          name: role === "buy" ? "Buy Scenario" : "Make Scenario",
          config: { ...defaultConfig, granularity: "standard" },
          inputs: { ...defaultInputs, toolingCost: role === "buy" ? 0 : 120000 }
        });
        if (role === "buy") setBuyId(id);
        else setMakeId(id);
      };

      return (
        <div className="space-y-6 animate-[fadeIn_0.2s_ease-out]">
          <div>
            <h1 className="text-2xl font-bold tracking-tight">Make vs. Buy Analysis</h1>
            <p className="text-xs text-muted-foreground mt-1">Determine the crossover production volume at which insourcing becomes more cost-effective.</p>
          </div>

          <div className="flex gap-4">
            {/* Make Picker */}
            <div className="bg-card border border-card-border rounded-lg p-5 flex-1 space-y-3">
              <span className="text-xs font-semibold uppercase tracking-wider text-blue-400 block">In-house (Make)</span>
              <select value={makeId || ""} onChange={e => setMakeId(e.target.value)} className="w-full bg-input/20 border border-border rounded px-3 py-2 text-xs outline-none focus:ring-1 focus:ring-ring">
                <option value="" disabled>-- Select Make scenario --</option>
                {scenarios.map(s => <option key={`make-pick-${s.id}`} value={s.id} className="bg-card text-foreground">{s.name}</option>)}
              </select>
              {!makeId && <button onClick={() => createDefaultScenario("make")} className="text-xs text-primary hover:underline cursor-pointer block">+ Create Make Case</button>}
            </div>

            {/* Buy Picker */}
            <div className="bg-card border border-card-border rounded-lg p-5 flex-1 space-y-3">
              <span className="text-xs font-semibold uppercase tracking-wider text-yellow-400 block">Outsourced (Buy)</span>
              <select value={buyId || ""} onChange={e => setBuyId(e.target.value)} className="w-full bg-input/20 border border-border rounded px-3 py-2 text-xs outline-none focus:ring-1 focus:ring-ring">
                <option value="" disabled>-- Select Buy scenario --</option>
                {scenarios.map(s => <option key={`buy-pick-${s.id}`} value={s.id} className="bg-card text-foreground">{s.name}</option>)}
              </select>
              {!buyId && <button onClick={() => createDefaultScenario("buy")} className="text-xs text-primary hover:underline cursor-pointer block">+ Create Buy Case</button>}
            </div>
          </div>

          {analysis && buyId !== makeId ? (
            <>
              {/* Verdict */}
              <div className={`rounded-lg border p-4 flex items-center gap-3 ${analysis.annualSavingsAtCurrentVolume > 0 ? "border-blue-500/30 bg-blue-500/5" : "border-yellow-500/30 bg-yellow-500/5"}`}>
                <Icon name="info" className={`w-5 h-5 ${analysis.annualSavingsAtCurrentVolume > 0 ? "text-blue-400" : "text-yellow-400"}`} />
                <div className="text-xs text-muted-foreground leading-relaxed">
                  {analysis.annualSavingsAtCurrentVolume > 0 ? (
                    <span>Make (In-house) is cheaper at current volume. Saves <span className="text-foreground font-bold">${formatNumber(analysis.buyCPU - analysis.makeCPUAtConfigVolume)}/unit</span> ({formatLargeMoney(analysis.annualSavingsAtCurrentVolume)}/yr).</span>
                  ) : (
                    <span>Buy (Outsourced) is cheaper. Make is more expensive by <span className="text-foreground font-bold">${formatNumber(analysis.makeCPUAtConfigVolume - analysis.buyCPU)}/unit</span> due to tooling Capex.</span>
                  )}
                  {analysis.crossoverVolume && (
                    <span className="block mt-0.5">Make becomes preferred at volumes above <span className="font-semibold text-primary">{analysis.crossoverVolume.toLocaleString()}</span> units/yr.</span>
                  )}
                </div>
              </div>

              {/* KPIs */}
              <div className="grid grid-cols-3 gap-4">
                <div className="bg-card border border-card-border rounded-lg p-5">
                  <div className="text-xs text-muted-foreground uppercase mb-1">Crossover Volume</div>
                  <div className="text-lg font-bold text-foreground">{analysis.crossoverVolume ? `${analysis.crossoverVolume.toLocaleString()} units` : "Never"}</div>
                </div>
                <div className="bg-card border border-card-border rounded-lg p-5">
                  <div className="text-xs text-muted-foreground uppercase mb-1">Annual Impact</div>
                  <div className={`text-lg font-bold ${analysis.annualSavingsAtCurrentVolume > 0 ? "text-green-400" : "text-yellow-400"}`}>
                    {formatLargeMoney(analysis.annualSavingsAtCurrentVolume)}/yr
                  </div>
                </div>
                <div className="bg-card border border-card-border rounded-lg p-5">
                  <div className="text-xs text-muted-foreground uppercase mb-1">Tooling Payback</div>
                  <div className="text-lg font-bold text-foreground">
                    {analysis.toolingPaybackMonths ? `${analysis.toolingPaybackMonths.toFixed(1)} mo` : "N/A"}
                  </div>
                </div>
              </div>

              {/* Curve Chart */}
              <div className="bg-card border border-card-border rounded-lg p-5">
                <h3 className="text-xs font-semibold uppercase tracking-wider text-muted-foreground mb-4">Unit Cost Absorption Curve</h3>
                <div className="h-56">
                  <ResponsiveContainer width="100%" height="100%">
                    <LineChart data={analysis.curvePoints}>
                      <XAxis dataKey="volume" tickFormatter={v => v.toLocaleString()} tick={{ fontSize: 10, fill: "hsl(210,14%,52%)" }} />
                      <YAxis tickFormatter={v => `$${v}`} tick={{ fontSize: 10, fill: "hsl(210,14%,52%)" }} />
                      <Tooltip contentStyle={{ background: "hsl(222,26%,12%)", border: "1px solid hsl(222,20%,18%)" }} />
                      <Line type="monotone" dataKey="makeCPU" stroke="hsl(210,90%,56%)" strokeWidth={2.5} name="Make (In-house)" />
                      <Line type="monotone" dataKey="buyCPU" stroke="hsl(38,90%,52%)" strokeWidth={2.5} name="Buy (Outsource)" />
                      {analysis.crossoverVolume && (
                        <ReferenceLine x={analysis.crossoverVolume} stroke="hsl(142,70%,42%)" strokeDasharray="3 3" />
                      )}
                    </LineChart>
                  </ResponsiveContainer>
                </div>
              </div>
            </>
          ) : (
            <div className="bg-card border border-card-border rounded-lg p-10 text-center text-xs text-muted-foreground">Select two different scenarios above to run Make vs. Buy comparison analysis.</div>
          )}

          {/* Methodology Explanation */}
          <div className="bg-card/40 border border-border/60 rounded-lg p-5 mt-6 flex gap-3 text-xs leading-relaxed">
            <div className="text-primary mt-0.5"><Icon name="info" className="w-4 h-4" /></div>
            <div>
              <h4 className="font-bold text-foreground mb-1">Methodology: Make vs. Buy Analysis</h4>
              <p className="text-muted-foreground">
                This analysis evaluates the financial trade-offs of in-house manufacturing (Make) versus outsourcing (Buy). In-house production typically requires an upfront fixed investment in tooling Capex, but delivers a lower variable cost per unit. Outsourcing has zero upfront tooling, but incurs a higher unit purchase price. The <strong>Crossover Volume</strong> is solved algebraically as: Crossover Volume = Make Tooling Investment / (Make Tooling Amortization Years * (Buy CPU - Make Variable CPU)). This represents the annual volume threshold above which the savings in variable unit costs justify the fixed tooling expenditure.
              </p>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────────────────────
    // Facility Capital Budgeting Component
    // ─────────────────────────────────────────────────────────────────────────

    function FacilityPage({ activeScenario }) {
      const [inputs, setInputs] = useState(getFacilityInputs);

      useEffect(() => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(inputs));
      }, [inputs]);

      const results = useMemo(() => calculateFacility(inputs), [inputs]);

      const set = (key, value) => {
        setInputs(prev => ({ ...prev, [key]: value }));
      };

      const syncFromActiveScenario = () => {
        const breakdown = calculateCosts(activeScenario.config, activeScenario.inputs);
        setInputs(prev => ({
          ...prev,
          asp: activeScenario.config.sellingPrice,
          variableCpuPerUnit: parseFloat(breakdown.totalCost.toFixed(2)),
          currentVolume: activeScenario.config.annualVolume
        }));
      };

      return (
        <div className="space-y-6 animate-[fadeIn_0.2s_ease-out]">
          <div className="flex items-center justify-between">
            <div>
              <h1 className="text-2xl font-bold tracking-tight">Facility Investment CapEx Solver</h1>
              <p className="text-xs text-muted-foreground mt-1">Evaluate facility expansions, utilization thresholds, NPV, and IRR metrics.</p>
            </div>
            <button onClick={syncFromActiveScenario} className="flex items-center gap-1.5 text-xs border border-border px-3 py-2 rounded text-muted-foreground hover:text-foreground cursor-pointer transition-colors">
              <Icon name="rotate" className="w-3.5 h-3.5" /> Sync from active scenario
            </button>
          </div>

          <div className="grid grid-cols-5 gap-6">
            {/* Left Inputs */}
            <div className="col-span-2 space-y-4">
              <div className="bg-card border border-card-border rounded-lg p-5 space-y-3">
                <h3 className="text-xs font-semibold uppercase tracking-wider text-muted-foreground">Investment Settings</h3>
                <div className="space-y-2 text-xs">
                  <div className="flex items-center justify-between">
                    <span>Upfront CapEx ($)</span>
                    <input type="number" value={inputs.capEx} onChange={e => set("capEx", parseFloat(e.target.value) || 0)} className="w-24 bg-input/20 border border-border rounded px-2.5 py-1 text-right" />
                  </div>
                  <div className="flex items-center justify-between">
                    <span>Useful Life (Years)</span>
                    <input type="number" value={inputs.usefulLifeYears} onChange={e => set("usefulLifeYears", parseInt(e.target.value) || 0)} className="w-24 bg-input/20 border border-border rounded px-2.5 py-1 text-right" />
                  </div>
                  <div className="flex items-center justify-between">
                    <span>Discount Rate (Hurdle %)</span>
                    <input type="number" value={inputs.discountRatePct} onChange={e => set("discountRatePct", parseFloat(e.target.value) || 0)} className="w-24 bg-input/20 border border-border rounded px-2.5 py-1 text-right" />
                  </div>
                </div>
              </div>

              <div className="bg-card border border-card-border rounded-lg p-5 space-y-3">
                <h3 className="text-xs font-semibold uppercase tracking-wider text-muted-foreground">Capacity & Utilization</h3>
                <div className="space-y-2 text-xs">
                  <div className="flex items-center justify-between">
                    <span>Current Capacity (units/yr)</span>
                    <input type="number" value={inputs.currentCapacity} onChange={e => set("currentCapacity", parseInt(e.target.value) || 0)} className="w-24 bg-input/20 border border-border rounded px-2.5 py-1 text-right" />
                  </div>
                  <div className="flex items-center justify-between">
                    <span>New Expansion Capacity</span>
                    <input type="number" value={inputs.newCapacity} onChange={e => set("newCapacity", parseInt(e.target.value) || 0)} className="w-24 bg-input/20 border border-border rounded px-2.5 py-1 text-right" />
                  </div>
                  <div className="flex items-center justify-between">
                    <span>Target Utilization (%)</span>
                    <input type="number" value={inputs.targetUtilizationPct} onChange={e => set("targetUtilizationPct", parseFloat(e.target.value) || 0)} className="w-24 bg-input/20 border border-border rounded px-2.5 py-1 text-right" />
                  </div>
                </div>
              </div>

              <div className="bg-card border border-card-border rounded-lg p-5 space-y-3">
                <h3 className="text-xs font-semibold uppercase tracking-wider text-muted-foreground">Fixed & Variable Cost</h3>
                <div className="space-y-2 text-xs">
                  <div className="flex items-center justify-between">
                    <span>Variable CPU ($)</span>
                    <input type="number" value={inputs.variableCpuPerUnit} onChange={e => set("variableCpuPerUnit", parseFloat(e.target.value) || 0)} className="w-24 bg-input/20 border border-border rounded px-2.5 py-1 text-right" />
                  </div>
                  <div className="flex items-center justify-between">
                    <span>Additional Fixed O&M ($/yr)</span>
                    <input type="number" value={inputs.additionalAnnualOverhead} onChange={e => set("additionalAnnualOverhead", parseFloat(e.target.value) || 0)} className="w-24 bg-input/20 border border-border rounded px-2.5 py-1 text-right" />
                  </div>
                </div>
              </div>
            </div>

            {/* Right Output Panel */}
            <div className="col-span-3 space-y-4">
              <div className="grid grid-cols-3 gap-3">
                <div className="bg-card border border-card-border rounded-lg p-4">
                  <div className="text-[10px] text-muted-foreground uppercase mb-0.5">Payback Years</div>
                  <div className="text-lg font-bold text-foreground">
                    {isFinite(results.paybackMonths) ? `${(results.paybackMonths / 12).toFixed(1)} yrs` : "Never"}
                  </div>
                </div>
                <div className="bg-card border border-card-border rounded-lg p-4">
                  <div className="text-[10px] text-muted-foreground uppercase mb-0.5">Net Present Value</div>
                  <div className={`text-lg font-bold ${results.npv >= 0 ? "text-green-400" : "text-red-400"}`}>
                    {formatLargeMoney(results.npv)}
                  </div>
                </div>
                <div className="bg-card border border-card-border rounded-lg p-4">
                  <div className="text-[10px] text-muted-foreground uppercase mb-0.5">Expansion IRR</div>
                  <div className="text-lg font-bold text-foreground">
                    {isFinite(results.irr) && !isNaN(results.irr) ? `${(results.irr * 100).toFixed(1)}%` : "N/A"}
                  </div>
                </div>
              </div>

              {/* Absorption Curve Chart */}
              <div className="bg-card border border-card-border rounded-lg p-5">
                <h3 className="text-xs font-semibold uppercase tracking-wider text-muted-foreground mb-4">Cost Absorption (Before expansion vs After expansion)</h3>
                <div className="h-52">
                  <ResponsiveContainer width="100%" height="100%">
                    <LineChart data={results.cpuCurve}>
                      <XAxis dataKey="volume" tickFormatter={v => v.toLocaleString()} tick={{ fontSize: 9, fill: "hsl(210,14%,52%)" }} />
                      <YAxis tickFormatter={v => `$${v}`} tick={{ fontSize: 9, fill: "hsl(210,14%,52%)" }} />
                      <Tooltip contentStyle={{ background: "hsl(222,26%,12%)", border: "1px solid hsl(222,20%,18%)" }} />
                      <Line type="monotone" dataKey="after" stroke="hsl(210,90%,56%)" strokeWidth={2.5} name="After Expansion" />
                      <Line type="monotone" dataKey="before" stroke="hsl(38,90%,52%)" strokeWidth={2.5} name="Before Expansion" connectNulls={false} />
                    </LineChart>
                  </ResponsiveContainer>
                </div>
              </div>

              {/* Cumulative cash flow chart */}
              <div className="bg-card border border-card-border rounded-lg p-5">
                <h3 className="text-xs font-semibold uppercase tracking-wider text-muted-foreground mb-4">Cumulative Project Cash Flow ($)</h3>
                <div className="h-44">
                  <ResponsiveContainer width="100%" height="100%">
                    <AreaChart data={results.cashFlowByYear}>
                      <XAxis dataKey="year" tickFormatter={v => `Yr ${v}`} tick={{ fontSize: 9, fill: "hsl(210,14%,52%)" }} />
                      <YAxis tickFormatter={v => fmtM(v)} tick={{ fontSize: 9, fill: "hsl(210,14%,52%)" }} />
                      <Tooltip formatter={v => [formatLargeMoney(v)]} contentStyle={{ background: "hsl(222,26%,12%)", border: "1px solid hsl(222,20%,18%)" }} />
                      <ReferenceLine y={0} stroke="hsl(210,14%,40%)" strokeWidth={1} />
                      <Area type="monotone" dataKey="cumulative" stroke="hsl(142,70%,42%)" fill="hsl(142,70%,42%)" fillOpacity={0.1} name="Simple Cash Flow" />
                      <Area type="monotone" dataKey="npvCumulative" stroke="hsl(210,90%,56%)" strokeDasharray="3 3" fill="hsl(210,90%,56%)" fillOpacity={0.05} name="Discounted NPV Cash Flow" />
                    </AreaChart>
                  </ResponsiveContainer>
                </div>
              </div>
            </div>
          </div>

          {/* Methodology Explanation */}
          <div className="bg-card/40 border border-border/60 rounded-lg p-5 mt-6 flex gap-3 text-xs leading-relaxed">
            <div className="text-primary mt-0.5"><Icon name="info" className="w-4 h-4" /></div>
            <div>
              <h4 className="font-bold text-foreground mb-1">Methodology Overview: Dashboard Analytics</h4>
              <p className="text-muted-foreground">
                This dashboard aggregates data across your active product configuration. <strong>Cost Per Unit (CPU)</strong> is calculated dynamically based on chosen granularity. <strong>Gross Margin %</strong> evaluates profitability as: (ASP - CPU) / ASP. <strong>Annualized Profit</strong> projects total returns over volume: Volume * Unit Margin, while sub-panels query and display comparison results from the Make vs. Buy and Facility modules.
              </p>
            </div>
          </div>
        </div>
      );
    }

    // Mount to DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
