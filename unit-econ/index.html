    const defaultInputs = {

    function defaultFacilityInputs() {
      return {
        capEx: 500000,
        usefulLifeYears: 7,
        discountRatePct: 12,
        salvageValue: 25000,
        currentCapacity: 2000,
        newCapacity: 4000,
        targetUtilizationPct: 80,
        asp: 10000,
        variableCpuPerUnit: 1708,
        currentFixedOverheadPerYear: 300000,
        additionalAnnualOverhead: 80000,
        currentVolume: 1200,
      };
    }

    function calculateCosts(config, inputs) {
      let materials = 0;
      let labor = 0;
      let overhead = 0;

      if (config.granularity === "simple") {
        materials = inputs.materialsSimple;
        labor = inputs.laborSimple;
        overhead = inputs.overheadSimple;
      } else if (config.granularity === "standard") {
        materials = inputs.materialsStandard;
        labor = inputs.laborHoursStandard * inputs.laborRateStandard;
        overhead = inputs.overheadRateStandard;
      } else {
        materials = inputs.bomItems.reduce((sum, item) => sum + item.quantity * item.unitCost, 0);
        labor = inputs.laborSteps.reduce((sum, step) => sum + step.hours * step.rate, 0);
        overhead = inputs.overheadMachineHours * inputs.overheadMachineRate +
                   inputs.overheadFacilityAllocation +
                   inputs.overheadUtilitiesPerUnit;
      }

      let tooling = 0;
      let yieldLoss = 0;
      let scrapDisposal = 0;
      let packaging = 0;
      let logistics = 0;
      let warranty = 0;

      if (config.granularity !== "simple") {
        if (inputs.toolingAmortizationYears > 0 && config.annualVolume > 0) {
          tooling = inputs.toolingCost / (inputs.toolingAmortizationYears * config.annualVolume);
        } else if (inputs.toolingLifetimeUnits > 0) {
          tooling = inputs.toolingCost / inputs.toolingLifetimeUnits;
        }
        const yieldMultiplier = inputs.yieldRate > 0 && inputs.yieldRate < 1 ? (1 / inputs.yieldRate) - 1 : 0;
        yieldLoss = materials * yieldMultiplier;
        scrapDisposal = inputs.scrapDisposalCostPerUnit * yieldMultiplier;
        packaging = inputs.packagingCost;
        logistics = inputs.logisticsInbound + inputs.logisticsOutbound;
        warranty = config.sellingPrice * inputs.warrantyProvisionPercent;
      }

      const totalCost = materials + labor + overhead + tooling + yieldLoss + scrapDisposal + packaging + logistics + warranty;
      const grossMargin = config.sellingPrice - totalCost;
      const grossMarginPercent = config.sellingPrice > 0 ? grossMargin / config.sellingPrice : 0;

      return {
        materials, labor, overhead, tooling, yieldLoss, scrapDisposal, packaging, logistics, warranty,
        totalCost, grossMargin, grossMarginPercent
      };
    }

    function solveForVariable(config, inputs, variable, goal) {
      const current = calculateCosts(config, inputs);
      let targetCPU = 0;
      if (goal.type === "target_cpu" && goal.targetCPU !== undefined) {
        targetCPU = goal.targetCPU;
      } else if (goal.type === "target_margin" && goal.targetMarginPercent !== undefined) {
        targetCPU = config.sellingPrice * (1 - goal.targetMarginPercent / 100);
      } else if (goal.type === "investment_payback" && goal.investmentAmount !== undefined) {
        const annualVolume = config.annualVolume;
        if (annualVolume <= 0) return null;
        const paybackYears = goal.paybackYears ?? 3;
        const requiredCostSavingPerUnit = goal.investmentAmount / (annualVolume * paybackYears);
        targetCPU = current.totalCost - requiredCostSavingPerUnit;
      }

      const requiredReduction = current.totalCost - targetCPU;
      let solvedValue = 0;
      let currentValue = 0;
      let feasible = true;
      let message = "";

      switch (variable) {
        case "materialsSimple":
          currentValue = inputs.materialsSimple;
          solvedValue = inputs.materialsSimple - requiredReduction;
          break;
        case "laborSimple":
          currentValue = inputs.laborSimple;
          solvedValue = inputs.laborSimple - requiredReduction;
          break;
        case "overheadSimple":
          currentValue = inputs.overheadSimple;
          solvedValue = inputs.overheadSimple - requiredReduction;
          break;
        case "materialsStandard":
          currentValue = inputs.materialsStandard;
          solvedValue = inputs.materialsStandard - requiredReduction;
          break;
        case "laborHoursStandard":
          currentValue = inputs.laborHoursStandard;
          const currentLaborCost = inputs.laborHoursStandard * inputs.laborRateStandard;
          solvedValue = inputs.laborRateStandard > 0 ? (currentLaborCost - requiredReduction) / inputs.laborRateStandard : 0;
          break;
        case "laborRateStandard":
          currentValue = inputs.laborRateStandard;
          const currentLaborCost2 = inputs.laborHoursStandard * inputs.laborRateStandard;
          solvedValue = inputs.laborHoursStandard > 0 ? (currentLaborCost2 - requiredReduction) / inputs.laborHoursStandard : 0;
          break;
        case "overheadRateStandard":
          currentValue = inputs.overheadRateStandard;
          solvedValue = inputs.overheadRateStandard - requiredReduction;
          break;
        case "toolingCost":
          currentValue = inputs.toolingCost;
          const targetTooling = current.tooling - requiredReduction;
          if (inputs.toolingAmortizationYears > 0 && config.annualVolume > 0) {
            solvedValue = targetTooling * inputs.toolingAmortizationYears * config.annualVolume;
          } else if (inputs.toolingLifetimeUnits > 0) {
            solvedValue = targetTooling * inputs.toolingLifetimeUnits;
          }
          break;
        case "annualVolume":
          currentValue = config.annualVolume;
          if (inputs.toolingAmortizationYears > 0 && inputs.toolingCost > 0) {
            const toolingNeeded = current.tooling - requiredReduction;
            if (toolingNeeded <= 0) {
              solvedValue = Infinity;
              feasible = false;
              message = "Volume increase alone cannot achieve this target.";
            } else {
              solvedValue = inputs.toolingCost / (inputs.toolingAmortizationYears * toolingNeeded);
            }
          } else {
            feasible = false;
            message = "Volume only affects tooling. No tooling is configured.";
            solvedValue = config.annualVolume;
          }
          break;
        case "yieldRate":
          currentValue = inputs.yieldRate * 100;
          const targetYieldLoss = current.yieldLoss - requiredReduction;
          if (current.materials > 0 && targetYieldLoss >= 0) {
            solvedValue = (1 / (targetYieldLoss / current.materials + 1)) * 100;
          } else {
            solvedValue = 100;
            feasible = false;
            message = "Yield improvement alone cannot achieve this target.";
          }
          break;
        case "packagingCost":
          currentValue = inputs.packagingCost;
          solvedValue = inputs.packagingCost - requiredReduction;
          break;
        case "logisticsInbound":
          currentValue = inputs.logisticsInbound;
          solvedValue = inputs.logisticsInbound - requiredReduction;
          break;
        case "logisticsOutbound":
          currentValue = inputs.logisticsOutbound;
          solvedValue = inputs.logisticsOutbound - requiredReduction;
          break;
        case "warrantyProvisionPercent":
          currentValue = inputs.warrantyProvisionPercent * 100;
          const targetWarranty = current.warranty - requiredReduction;
          solvedValue = config.sellingPrice > 0 ? (targetWarranty / config.sellingPrice) * 100 : 0;
          break;
        case "sellingPrice":
          currentValue = config.sellingPrice;
          if (goal.type === "target_margin" && goal.targetMarginPercent !== undefined) {
            const margin = goal.targetMarginPercent / 100;
            solvedValue = margin < 1 ? current.totalCost / (1 - margin) : 0;
          } else {
            solvedValue = current.totalCost + (goal.targetCPU ? goal.targetCPU - current.totalCost : 0);
          }
          break;
      }

      if (solvedValue < 0) {
        feasible = false;
        message = "Required value is negative — target unachievable.";
      }

      const delta = solvedValue - currentValue;
      const deltaPercent = currentValue !== 0 ? (delta / Math.abs(currentValue)) * 100 : 0;
      if (!message && feasible) {
        message = delta < 0 ? `Requires a ${Math.abs(deltaPercent).toFixed(1)}% reduction.` : `Requires a ${Math.abs(deltaPercent).toFixed(1)}% increase.`;
      }

      const res = { solvedValue, currentValue, delta, deltaPercent, feasible, message };
      if (goal.type === "investment_payback" && goal.investmentAmount !== undefined) {
        res.requiredCostSavingPerUnit = current.totalCost - targetCPU;
        res.annualSavings = res.requiredCostSavingPerUnit * config.annualVolume;
        res.paybackMonths = res.annualSavings > 0 ? (goal.investmentAmount / res.annualSavings) * 12 : Infinity;
      }
      return res;
    }

    function overrideVariable(config, inputs, variable, value) {
      const nextConfig = { ...config };
      const nextInputs = { ...inputs };
      switch (variable) {
        case "materialsSimple": nextInputs.materialsSimple = value; break;
        case "laborSimple": nextInputs.laborSimple = value; break;
        case "overheadSimple": nextInputs.overheadSimple = value; break;
        case "materialsStandard": nextInputs.materialsStandard = value; break;
        case "laborHoursStandard": nextInputs.laborHoursStandard = value; break;
        case "laborRateStandard": nextInputs.laborRateStandard = value; break;
        case "overheadRateStandard": nextInputs.overheadRateStandard = value; break;
        case "toolingCost": nextInputs.toolingCost = value; break;
        case "annualVolume": nextConfig.annualVolume = value; break;
        case "yieldRate": nextInputs.yieldRate = value / 100; break;
        case "packagingCost": nextInputs.packagingCost = value; break;
        case "logisticsInbound": nextInputs.logisticsInbound = value; break;
        case "logisticsOutbound": nextInputs.logisticsOutbound = value; break;
        case "warrantyProvisionPercent": nextInputs.warrantyProvisionPercent = value / 100; break;
        case "sellingPrice": nextConfig.sellingPrice = value; break;
      }
      return { config: nextConfig, inputs: nextInputs };
    }

    function makevsBuyAnalysis(buyConfig, buyInputs, makeConfig, makeInputs) {
      const buyCPU = calculateCosts(buyConfig, buyInputs).totalCost;
      const makeAtInfinity = calculateCosts({ ...makeConfig, annualVolume: 99999999 }, makeInputs).totalCost;
      const makeFull = calculateCosts(makeConfig, makeInputs);
      const crossoverVolume = buyCPU - makeAtInfinity > 0 ? Math.ceil(makeInputs.toolingCost / (makeInputs.toolingAmortizationYears * (buyCPU - makeAtInfinity))) : null;
      const annualSavingsAtCurrentVolume = (buyCPU - makeFull.totalCost) * makeConfig.annualVolume;
      const toolingPaybackMonths = annualSavingsAtCurrentVolume > 0 ? (makeInputs.toolingCost / annualSavingsAtCurrentVolume) * 12 : null;
      
      const curvePoints = [];
      const refPoint = crossoverVolume ?? makeConfig.annualVolume;
      const minV = Math.max(10, Math.round(refPoint * 0.2));
      const maxV = Math.round(refPoint * 3);
      const step = Math.ceil((maxV - minV) / 30);
      for (let v = minV; v <= maxV; v += step) {
        const mc = calculateCosts({ ...makeConfig, annualVolume: v }, makeInputs).totalCost;
        curvePoints.push({ volume: v, makeCPU: mc, buyCPU });
      }

      return { crossoverVolume, buyCPU, makeCPUAtConfigVolume: makeFull.totalCost, annualSavingsAtCurrentVolume, toolingPaybackMonths, curvePoints };
    }

    // ─────────────────────────────────────────────────────────────────────────

    function formatNumber(v, decimals = 2) {
      if (v === undefined || isNaN(v)) return "0.00";
      return v.toLocaleString("en-US", { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
    }

    const fmt = formatNumber;

    function formatLargeMoney(v, includeDollar = true) {
      if (v === undefined || isNaN(v) || v === null) return includeDollar ? "$0.00" : "0.00";
      const abs = Math.abs(v);
      const sign = v < 0 ? "-" : "";
      const dollar = includeDollar ? "$" : "";
      
      if (abs >= 1000000000) {
        const val = abs / 1000000000;
        let formatted = val.toFixed(2);
        if (formatted.endsWith('.00')) {
          formatted = formatted.substring(0, formatted.length - 3);
        } else if (formatted.endsWith('0')) {
          formatted = formatted.substring(0, formatted.length - 1);
        }
        return `${sign}${dollar}${formatted}B`;
      }
      if (abs >= 1000000) {
        const val = abs / 1000000;
        let formatted = val.toFixed(2);
        if (formatted.endsWith('.00')) {
          formatted = formatted.substring(0, formatted.length - 3);
        } else if (formatted.endsWith('0')) {
          formatted = formatted.substring(0, formatted.length - 1);
        }
        return `${sign}${dollar}${formatted}M`;
      }
      if (abs >= 1000) {
        const val = abs / 1000;
        let formatted = val.toFixed(1);
        if (formatted.endsWith('.0')) {
          formatted = formatted.substring(0, formatted.length - 2);
        }
        return `${sign}${dollar}${formatted}K`;
      }
      return `${sign}${dollar}${formatNumber(abs, 2)}`;
    }

    function fmtM(v) {
      return formatLargeMoney(v, true);
    }

    function getFacilityInputs() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) return { ...defaultFacilityInputs(), ...JSON.parse(saved) };
      } catch (_) {
        /* ignore */
      }
      return defaultFacilityInputs();
    }

    function calculateFacility(inp) {
      const r = inp.discountRatePct / 100;
      const targetVolume = inp.newCapacity * (inp.targetUtilizationPct / 100);
      const incrementalVolume = Math.max(0, targetVolume - inp.currentVolume);
      const CM = inp.asp - inp.variableCpuPerUnit;
      const annualDepreciation = (inp.capEx - inp.salvageValue) / Math.max(1, inp.usefulLifeYears);

      const annualCashFlow = incrementalVolume * CM - inp.additionalAnnualOverhead;
      const cashFlows = [-inp.capEx];
      for (let y = 1; y <= inp.usefulLifeYears; y++) {
        cashFlows.push(annualCashFlow + (y === inp.usefulLifeYears ? inp.salvageValue : 0));
      }

      // NPV Calculation
      const npv = cashFlows.reduce((sum, cf, t) => sum + cf / Math.pow(1 + r, t), 0);

      // IRR solver
      let irr = NaN;
      let lo = -0.99, hi = 5.0;
      for (let i = 0; i < 200; i++) {
        const mid = (lo + hi) / 2;
        const v = cashFlows.reduce((sum, cf, t) => sum + cf / Math.pow(1 + mid, t), 0);
        if (Math.abs(v) < 0.01) { irr = mid; break; }
        if (v > 0) lo = mid;
        else hi = mid;
      }

      const paybackMonths = annualCashFlow > 0 ? (inp.capEx / annualCashFlow) * 12 : Infinity;
      const capacityGainPct = inp.currentCapacity > 0 ? ((inp.newCapacity - inp.currentCapacity) / inp.currentCapacity) * 100 : 0;
      const breakEvenIncrementalVolume = CM > 0 ? (inp.additionalAnnualOverhead + annualDepreciation) / CM : Infinity;
      const breakEvenUtilizationPct = inp.newCapacity > 0 ? ((inp.currentVolume + breakEvenIncrementalVolume) / inp.newCapacity) * 100 : 100;

      // curves
      const cpuCurve = Array.from({ length: 25 }, (_, i) => {
        const pct = 0.1 + (i / 24) * 0.9;
        const volume = Math.round(inp.newCapacity * pct);
        const before = volume <= inp.currentCapacity ? inp.variableCpuPerUnit + inp.currentFixedOverheadPerYear / volume : null;
        const after = inp.variableCpuPerUnit + (inp.currentFixedOverheadPerYear + inp.additionalAnnualOverhead + annualDepreciation) / volume;
        return { volume, before, after };
      });

      let cumCF = -inp.capEx;
      let cumDisc = -inp.capEx;
      const cashFlowByYear = [{ year: 0, incremental: -inp.capEx, cumulative: cumCF, npvCumulative: cumDisc }];
      for (let y = 1; y <= inp.usefulLifeYears; y++) {
        const cf = cashFlows[y];
        cumCF += cf;
        cumDisc += cf / Math.pow(1 + r, y);
        cashFlowByYear.push({ year: y, incremental: cf, cumulative: cumCF, npvCumulative: cumDisc });
      }

      return {
        targetVolume, incrementalVolume, contributionMarginPerUnit: CM, annualDepreciation,
        paybackMonths, npv, irr, capacityGainPct, breakEvenUtilizationPct, cpuCurve, cashFlowByYear
      };
    }

                  </span>
                  <button onClick={() => setPage("facility")} className="text-xs text-primary hover:underline">Details</button>
                </div>
                <div className="grid grid-cols-3 gap-2 text-xs text-center border-t border-border/40 pt-2">

                    <div className="text-muted-foreground mb-0.5">Payback</div>

              <div onClick={() => setPage("solver")} className="p-4 border border-border/60 hover:border-primary rounded-md cursor-pointer hover:bg-primary/5 transition-colors">
                <div className="font-semibold text-foreground text-sm flex items-center gap-1.5"><Icon name="target" className="text-primary w-4 h-4" /> Breakeven Solver</div>
                <div className="text-muted-foreground mt-1">Algebraically solve for variables to hit margin/payback goals.</div>
              </div>
              <div onClick={() => setPage("solver")} className="p-4 border border-border/60 hover:border-primary rounded-md cursor-pointer hover:bg-primary/5 transition-colors">
                <div className="font-semibold text-foreground text-sm flex items-center gap-1.5"><Icon name="dices" className="text-primary w-4 h-4" /> Monte Carlo Risk</div>
                <div className="text-muted-foreground mt-1">Run simulations to map probability distributions of costs.</div>

                <div className="font-semibold text-foreground text-sm flex items-center gap-1.5"><Icon name="layers" className="text-primary w-4 h-4" /> Compare Scenarios</div>

          config: {

          <div className="bg-card border border-card-border rounded-lg p-6 space-y-4">
            <div>

              <div>
                <label className="text-xs font-semibold text-muted-foreground uppercase tracking-wider block mb-1">Selling Price / Unit</label>
                <div className="flex items-center border border-border rounded bg-input/20 focus-within:ring-1 focus-within:ring-ring overflow-hidden">
                  <span className="px-3 py-2 text-xs text-muted-foreground bg-muted/40 border-r border-border">$</span>
                  <input type="number" value={price} onChange={e => setPrice(e.target.value)} className="flex-1 bg-transparent px-3 py-2 text-sm text-foreground outline-none" />

              </div>
              <div>
                <label className="text-xs font-semibold text-muted-foreground uppercase tracking-wider block mb-1">Annual Volume</label>

                  <input type="number" value={volume} onChange={e => setVolume(e.target.value)} className="flex-1 bg-transparent px-3 py-2 text-sm text-foreground outline-none text-right" />
                  <span className="px-3 py-2 text-xs text-muted-foreground bg-muted/40 border-l border-border">units</span>

              </div>

          </div>

          <div className="bg-card border border-card-border rounded-lg p-6">
            <h2 className="text-xs font-semibold text-muted-foreground uppercase tracking-wider mb-4">Model Granularity</h2>

                { value: "standard", label: "Standard (7 items)", desc: "Adds Tooling, Yield/Scrap, Packaging, Logistics, and Warranty." },
                { value: "detailed", label: "Detailed (Full BOM)", desc: "Build exact BOM lists, operation steps, and detailed machine runtimes." }

                <button
