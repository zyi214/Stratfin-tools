    // ─────────────────────────────────────────────────────────────────────────
    // Cost Model (Calculator) Component
    // ─────────────────────────────────────────────────────────────────────────

    function CalculatorPage({ 
      activeScenario, updateActiveScenario, addScenario, 
      importScenarios, importFromCSV, exportAsCSV, exportAsJSON 
    }) {
      const [exportOpen, setExportOpen] = useState(false);
      const { config, inputs } = activeScenario;
      const breakdown = calculateCosts(config, inputs);

      const updateInputs = (updates) => {
        updateActiveScenario({ inputs: { ...inputs, ...updates } });
      };

      const handleBomUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = ev.target.result;
            const workbook = XLSX.read(data, { type: "binary" });
            const worksheet = workbook.Sheets[workbook.SheetNames[0]];
            const json = XLSX.utils.sheet_to_json(worksheet);

            if (!Array.isArray(json) || json.length === 0) {
              alert("Empty sheet or invalid format");
              return;
            }

            const importedItems = [];
            json.forEach((row, idx) => {
              let name = "";
              let quantity = 1;
              let unitCost = 0;

              for (const key of Object.keys(row)) {
                const k = key.toLowerCase().trim();
                if (k.includes("name") || k.includes("part") || k.includes("component") || k.includes("description") || k === "item") {
                  name = String(row[key]);
                } else if (k.includes("qty") || k.includes("quantity") || k.includes("count")) {
                  quantity = parseFloat(row[key]) || 1;
                } else if (k.includes("cost") || k.includes("price") || k.includes("unitcost")) {
                  unitCost = parseFloat(row[key]) || 0;
                }
              }

              if (name) {
                importedItems.push({ id: `imported_${Date.now()}_${idx}`, name, quantity, unitCost });
              }
            });

            if (importedItems.length === 0) {
              alert("Could not map columns. Verify headers: 'Part Name', 'Qty', 'Unit Cost'.");
              return;
            }

            const overwrite = window.confirm(`Found ${importedItems.length} parts. Overwrite existing BOM?`);
            if (overwrite) {
              updateInputs({ bomItems: importedItems });
            } else {
              updateInputs({ bomItems: [...inputs.bomItems, ...importedItems] });
            }
          } catch (_) {
            alert("Error parsing spreadsheet file");
          }
        };
        reader.readAsBinaryString(file);
        e.target.value = "";
      };

      const addBomItem = () => {
        updateInputs({ bomItems: [...inputs.bomItems, { id: Date.now().toString(), name: "New Part", quantity: 1, unitCost: 0 }] });
      };

      const removeBomItem = (id) => {
        updateInputs({ bomItems: inputs.bomItems.filter(i => i.id !== id) });
      };

      const updateBomItem = (id, fields) => {
        updateInputs({ bomItems: inputs.bomItems.map(i => i.id === id ? { ...i, ...fields } : i) });
      };

      const addLaborStep = () => {
        updateInputs({ laborSteps: [...inputs.laborSteps, { id: Date.now().toString(), name: "New Op", hours: 1, rate: 20 }] });
      };

      const removeLaborStep = (id) => {
        updateInputs({ laborSteps: inputs.laborSteps.filter(s => s.id !== id) });
      };

      const updateLaborStep = (id, fields) => {
        updateInputs({ laborSteps: inputs.laborSteps.map(s => s.id === id ? { ...s, ...fields } : s) });
      };

      const chartData = [
        { name: "Materials", value: breakdown.materials, color: "hsl(210,90%,56%)" },
        { name: "Labor", value: breakdown.labor, color: "hsl(38,90%,52%)" },
        { name: "Overhead", value: breakdown.overhead, color: "hsl(142,70%,42%)" },
        ...(config.granularity !== "simple"
          ? [
              { name: "Tooling", value: breakdown.tooling, color: "hsl(262,52%,62%)" },
              { name: "Yield Loss", value: breakdown.yieldLoss + breakdown.scrapDisposal, color: "hsl(4,78%,58%)" },
              { name: "Logistics", value: breakdown.logistics, color: "hsl(180,60%,45%)" },
              { name: "Warranty", value: breakdown.warranty, color: "hsl(300,50%,55%)" },
            ]
          : []),
      ].filter(d => d.value > 0);

      return (
        <div className="space-y-6 animate-[fadeIn_0.2s_ease-out]">
          <div className="flex items-center justify-between">
            <div>
              <h1 className="text-2xl font-bold tracking-tight">Cost Build-Up Model</h1>
              <p className="text-xs text-muted-foreground mt-1">{config.name} · {config.granularity.toUpperCase()} Mode</p>
            </div>
            <div className="flex items-center gap-2 relative">
              <label className="flex items-center gap-1.5 text-xs border border-border px-3 py-1.5 rounded text-muted-foreground hover:text-foreground hover:border-foreground transition-colors cursor-pointer">
                <Icon name="upload" className="w-3.5 h-3.5" /> Import Data
                <input 
                  type="file" 
                  accept=".json,.csv" 
                  className="hidden" 
                  onChange={(e) => {
                    const file = e.target.files?.[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                      try {
                        const text = ev.target.result;
                        if (file.name.endsWith(".csv")) {
                          importFromCSV(text);
                        } else {
                          importScenarios(JSON.parse(text));
                        }
                      } catch {
                        alert("Invalid file format");
                      }
                    };
                    reader.readAsText(file);
                    e.target.value = "";
                  }}
                />
              </label>

              <div className="relative">
                <button 
                  onClick={() => setExportOpen(prev => !prev)} 
                  className="flex items-center gap-1.5 text-xs border border-border px-3 py-1.5 rounded text-muted-foreground hover:text-foreground hover:border-foreground transition-colors cursor-pointer"
                >
                  <Icon name="download" className="w-3.5 h-3.5" /> Export Data
                </button>
                {exportOpen && (
                  <div className="absolute right-0 mt-1 w-44 bg-card border border-border rounded-md shadow-xl py-1 z-50 flex flex-col text-xs font-medium">
                    <button 
                      onClick={() => { exportAsCSV(); setExportOpen(false); }} 
                      className="w-full text-left px-3 py-2 hover:bg-muted/40 text-foreground flex items-center gap-2 cursor-pointer"
                    >
                      <Icon name="download" className="w-3.5 h-3.5" /> Export as CSV (.csv)
                    </button>
                    <button 
                      onClick={() => { exportAsJSON(); setExportOpen(false); }} 
                      className="w-full text-left px-3 py-2 hover:bg-muted/40 text-foreground flex items-center gap-2 border-t border-border/40 cursor-pointer"
                    >
                      <Icon name="download" className="w-3.5 h-3.5" /> Export as JSON (.json)
                    </button>
                  </div>
                )}
              </div>

              <button
                onClick={() => addScenario({ name: `${activeScenario.name} (Copy)`, config: { ...config }, inputs: { ...inputs } })}
                className="text-xs bg-primary text-primary-foreground px-3 py-1.5 rounded hover:opacity-90 transition-opacity font-semibold cursor-pointer"
              >
                Clone Scenario
              </button>
            </div>
          </div>

          {/* Cards */}
          <div className="grid grid-cols-3 gap-4">
            <div className="bg-card border border-card-border rounded-lg p-4">
              <div className="text-xs text-muted-foreground uppercase tracking-wider mb-1">Cost Per Unit</div>
              <div className="text-xl font-bold text-foreground">${formatNumber(breakdown.totalCost)}</div>
            </div>
            <div className="bg-card border border-card-border rounded-lg p-4">
              <div className="text-xs text-muted-foreground uppercase tracking-wider mb-1">Gross Margin</div>
              <div className={`text-xl font-bold ${breakdown.grossMarginPercent >= 0.3 ? "text-green-400" : "text-yellow-400"}`}>
                {(breakdown.grossMarginPercent * 100).toFixed(1)}% <span className="text-xs text-muted-foreground">(${formatNumber(breakdown.grossMargin)}/unit)</span>
              </div>
            </div>
            <div className="bg-card border border-card-border rounded-lg p-4">
              <div className="text-xs text-muted-foreground uppercase tracking-wider mb-1">Annual Cost</div>
              <div className="text-xl font-bold text-foreground">{formatLargeMoney(breakdown.totalCost * config.annualVolume)}</div>
            </div>
          </div>

          <div className="grid grid-cols-5 gap-6">
            {/* Left Inputs */}
            <div className="col-span-3 space-y-4">
              
              {/* Materials Card */}
              <div className="bg-card border border-card-border rounded-lg p-5">
                <h3 className="text-xs font-semibold uppercase tracking-wider text-muted-foreground mb-4">Materials</h3>
                {config.granularity === "simple" && (
                  <div className="flex items-center justify-between">
                    <span className="text-xs text-foreground">Materials Cost / Unit</span>
                    <input type="number" value={inputs.materialsSimple} onChange={e => updateInputs({ materialsSimple: parseFloat(e.target.value) || 0 })} className="bg-input/20 border border-border rounded px-3 py-1.5 text-xs outline-none focus:ring-1 focus:ring-ring text-right w-24" />
                  </div>
                )}
                {config.granularity === "standard" && (
                  <div className="flex items-center justify-between">
                    <span className="text-xs text-foreground">Materials Cost / Unit</span>
                    <input type="number" value={inputs.materialsStandard} onChange={e => updateInputs({ materialsStandard: parseFloat(e.target.value) || 0 })} className="bg-input/20 border border-border rounded px-3 py-1.5 text-xs outline-none focus:ring-1 focus:ring-ring text-right w-24" />
                  </div>
                )}
                {config.granularity === "detailed" && (
                  <div className="space-y-2">
                    <div className="grid grid-cols-12 gap-2 text-[10px] text-muted-foreground uppercase tracking-wider px-1">
                      <span className="col-span-6">Part Name</span>
                      <span className="col-span-2 text-center">Qty</span>
                      <span className="col-span-3 text-right">Unit Cost</span>
                      <span className="col-span-1" />
                    </div>
                    {inputs.bomItems.map(item => (
                      <div key={item.id} className="grid grid-cols-12 gap-2 items-center">
                        <input type="text" value={item.name} onChange={e => updateBomItem(item.id, { name: e.target.value })} className="col-span-6 bg-input/20 border border-border rounded px-2 py-1 text-xs outline-none" />
                        <input type="number" value={item.quantity} onChange={e => updateBomItem(item.id, { quantity: parseFloat(e.target.value) || 0 })} className="col-span-2 bg-input/20 border border-border rounded px-2 py-1 text-xs outline-none text-center" />
                        <input type="number" value={item.unitCost} onChange={e => updateBomItem(item.id, { unitCost: parseFloat(e.target.value) || 0 })} className="col-span-3 bg-input/20 border border-border rounded px-2 py-1 text-xs outline-none text-right" />
                        <button onClick={() => removeBomItem(item.id)} className="col-span-1 text-muted-foreground hover:text-red-400 flex justify-center"><Icon name="trash" className="w-3.5 h-3.5" /></button>
                      </div>
                    ))}
                    <div className="flex items-center gap-3 pt-2">
                      <button onClick={addBomItem} className="flex items-center gap-1 text-xs text-primary hover:underline cursor-pointer"><Icon name="plus" className="w-3.5 h-3.5" /> Add Item</button>
                      <label className="flex items-center gap-1.5 text-xs text-muted-foreground hover:text-foreground cursor-pointer border border-border/60 hover:border-border px-2 py-0.5 rounded transition-colors">
                        <Icon name="upload" className="w-3 h-3" /> Import Spreadsheet
                        <input type="file" accept=".xlsx,.xls,.csv" className="hidden" onChange={handleBomUpload} />
                      </label>
                    </div>
                  </div>
                )}
              </div>

              {/* Labor Card */}
              <div className="bg-card border border-card-border rounded-lg p-5">
                <h3 className="text-xs font-semibold uppercase tracking-wider text-muted-foreground mb-4">Labor</h3>
                {config.granularity === "simple" && (
                  <div className="flex items-center justify-between">
                    <span className="text-xs text-foreground">Labor Cost / Unit</span>
                    <input type="number" value={inputs.laborSimple} onChange={e => updateInputs({ laborSimple: parseFloat(e.target.value) || 0 })} className="bg-input/20 border border-border rounded px-3 py-1.5 text-xs outline-none focus:ring-1 focus:ring-ring text-right w-24" />
                  </div>
                )}
                {config.granularity === "standard" && (
                  <div className="space-y-3">
                    <div className="flex items-center justify-between">
                      <span className="text-xs text-foreground">Labor Hours / Unit</span>
                      <input type="number" value={inputs.laborHoursStandard} step="0.1" onChange={e => updateInputs({ laborHoursStandard: parseFloat(e.target.value) || 0 })} className="bg-input/20 border border-border rounded px-3 py-1.5 text-xs outline-none text-right w-24" />
                    </div>
                    <div className="flex items-center justify-between">
                      <span className="text-xs text-foreground">Labor Rate ($/hr)</span>
                      <input type="number" value={inputs.laborRateStandard} onChange={e => updateInputs({ laborRateStandard: parseFloat(e.target.value) || 0 })} className="bg-input/20 border border-border rounded px-3 py-1.5 text-xs outline-none text-right w-24" />
                    </div>
                  </div>
                )}
                {config.granularity === "detailed" && (
                  <div className="space-y-2">
                    <div className="grid grid-cols-12 gap-2 text-[10px] text-muted-foreground uppercase tracking-wider px-1">
                      <span className="col-span-6">Operation</span>
                      <span className="col-span-2 text-center">Hours</span>
                      <span className="col-span-3 text-right">Rate/hr</span>
                      <span className="col-span-1" />
                    </div>
                    {inputs.laborSteps.map(step => (
                      <div key={step.id} className="grid grid-cols-12 gap-2 items-center">
                        <input type="text" value={step.name} onChange={e => updateLaborStep(step.id, { name: e.target.value })} className="col-span-6 bg-input/20 border border-border rounded px-2 py-1 text-xs outline-none" />
                        <input type="number" value={step.hours} step="0.1" onChange={e => updateLaborStep(step.id, { hours: parseFloat(e.target.value) || 0 })} className="col-span-2 bg-input/20 border border-border rounded px-2 py-1 text-xs outline-none text-center" />
                        <input type="number" value={step.rate} onChange={e => updateLaborStep(step.id, { rate: parseFloat(e.target.value) || 0 })} className="col-span-3 bg-input/20 border border-border rounded px-2 py-1 text-xs outline-none text-right" />
                        <button onClick={() => removeLaborStep(step.id)} className="col-span-1 text-muted-foreground hover:text-red-400 flex justify-center"><Icon name="trash" className="w-3.5 h-3.5" /></button>
                      </div>
                    ))}
                    <button onClick={addLaborStep} className="flex items-center gap-1 text-xs text-primary hover:underline cursor-pointer"><Icon name="plus" className="w-3.5 h-3.5" /> Add Step</button>
                  </div>
                )}
              </div>

              {/* Advanced Drivers (Standard/Detailed only) */}
              {config.granularity !== "simple" && (
                <>
                  {/* Overhead */}
                  <div className="bg-card border border-card-border rounded-lg p-5">
                    <h3 className="text-xs font-semibold uppercase tracking-wider text-muted-foreground mb-4">Overhead</h3>
                    {config.granularity === "standard" ? (
                      <div className="flex items-center justify-between">
                        <span className="text-xs text-foreground">Overhead Burden / Unit</span>
                        <input type="number" value={inputs.overheadRateStandard} onChange={e => updateInputs({ overheadRateStandard: parseFloat(e.target.value) || 0 })} className="bg-input/20 border border-border rounded px-3 py-1.5 text-xs outline-none text-right w-24" />
                      </div>
                    ) : (
                      <div className="space-y-3">
                        <div className="flex items-center justify-between">
                          <span className="text-xs text-foreground">Machine Runtime (hrs/unit)</span>
                          <input type="number" value={inputs.overheadMachineHours} step="0.1" onChange={e => updateInputs({ overheadMachineHours: parseFloat(e.target.value) || 0 })} className="bg-input/20 border border-border rounded px-3 py-1.5 text-xs outline-none text-right w-24" />
                        </div>
                        <div className="flex items-center justify-between">
                          <span className="text-xs text-foreground">Machine Rate ($/hr)</span>
                          <input type="number" value={inputs.overheadMachineRate} onChange={e => updateInputs({ overheadMachineRate: parseFloat(e.target.value) || 0 })} className="bg-input/20 border border-border rounded px-3 py-1.5 text-xs outline-none text-right w-24" />
                        </div>
                        <div className="flex items-center justify-between">
                          <span className="text-xs text-foreground">Facility Allocation / Unit</span>
                          <input type="number" value={inputs.overheadFacilityAllocation} onChange={e => updateInputs({ overheadFacilityAllocation: parseFloat(e.target.value) || 0 })} className="bg-input/20 border border-border rounded px-3 py-1.5 text-xs outline-none text-right w-24" />
                        </div>
                      </div>
                    )}
                  </div>

                  {/* Tooling / Capex */}
                  <div className="bg-card border border-card-border rounded-lg p-5">
                    <h3 className="text-xs font-semibold uppercase tracking-wider text-muted-foreground mb-4">Tooling Capex</h3>
                    <div className="space-y-3">
                      <div className="flex items-center justify-between">
                        <span className="text-xs text-foreground">Tooling Investment ($)</span>
                        <input type="number" value={inputs.toolingCost} onChange={e => updateInputs({ toolingCost: parseFloat(e.target.value) || 0 })} className="bg-input/20 border border-border rounded px-3 py-1.5 text-xs outline-none text-right w-24" />
                      </div>
                      <div className="flex items-center justify-between">
                        <span className="text-xs text-foreground">Amortization (years)</span>
                        <input type="number" value={inputs.toolingAmortizationYears} onChange={e => updateInputs({ toolingAmortizationYears: parseInt(e.target.value) || 0 })} className="bg-input/20 border border-border rounded px-3 py-1.5 text-xs outline-none text-right w-24" />
                      </div>
                    </div>
                  </div>

                  {/* Yield / Freight */}
                  <div className="bg-card border border-card-border rounded-lg p-5">
                    <h3 className="text-xs font-semibold uppercase tracking-wider text-muted-foreground mb-4">Yield, Freight & Logistics</h3>
                    <div className="space-y-3">
                      <div className="flex items-center justify-between">
                        <span className="text-xs text-foreground">First-Pass Yield (%)</span>
                        <input type="number" value={inputs.yieldRate * 100} onChange={e => updateInputs({ yieldRate: (parseFloat(e.target.value) || 0) / 100 })} className="bg-input/20 border border-border rounded px-3 py-1.5 text-xs outline-none text-right w-24" />
                      </div>
                      <div className="flex items-center justify-between">
                        <span className="text-xs text-foreground">Packaging Cost / Unit</span>
                        <input type="number" value={inputs.packagingCost} onChange={e => updateInputs({ packagingCost: parseFloat(e.target.value) || 0 })} className="bg-input/20 border border-border rounded px-3 py-1.5 text-xs outline-none text-right w-24" />
                      </div>
                      <div className="flex items-center justify-between">
                        <span className="text-xs text-foreground">Outbound Logistics / Unit</span>
                        <input type="number" value={inputs.logisticsOutbound} onChange={e => updateInputs({ logisticsOutbound: parseFloat(e.target.value) || 0 })} className="bg-input/20 border border-border rounded px-3 py-1.5 text-xs outline-none text-right w-24" />
                      </div>
                      <div className="flex items-center justify-between">
                        <span className="text-xs text-foreground">Warranty Provision (% of price)</span>
                        <input type="number" value={inputs.warrantyProvisionPercent * 100} step="0.1" onChange={e => updateInputs({ warrantyProvisionPercent: (parseFloat(e.target.value) || 0) / 100 })} className="bg-input/20 border border-border rounded px-3 py-1.5 text-xs outline-none text-right w-24" />
                      </div>
                    </div>
                  </div>
                </>
              )}
            </div>

            {/* Right Summary Grid */}
            <div className="col-span-2">
              <div className="bg-card border border-card-border rounded-lg p-5 sticky top-6 space-y-4">
                <h3 className="text-xs font-semibold uppercase tracking-wider text-muted-foreground">Cost Build-Up Summary</h3>
                <div className="space-y-2 text-xs">
                  {chartData.map(item => (
                    <div key={item.name} className="flex items-center justify-between">
                      <div className="flex items-center gap-2">
                        <div className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: item.color }} />
                        <span>{item.name}</span>
                      </div>
                      <span className="font-semibold text-foreground stat-value">${formatNumber(item.value)}</span>
                    </div>
                  ))}
                  <div className="border-t border-border/40 pt-3 flex justify-between font-bold text-sm text-primary">
                    <span>Total Cost Per Unit</span>
                    <span className="stat-value">${formatNumber(breakdown.totalCost)}</span>
                  </div>
                </div>

                {chartData.length > 0 && (
                  <div className="h-44 pt-4">
                    <ResponsiveContainer width="100%" height="100%">
                      <BarChart data={chartData} layout="vertical">
                        <XAxis type="number" hide />
                        <YAxis type="category" dataKey="name" width={65} tick={{ fontSize: 10, fill: "hsl(210,14%,52%)" }} />
                        <Bar dataKey="value" radius={[0, 4, 4, 0]}>
                          {chartData.map((d, idx) => (
                            <Cell key={`summary-bar-${idx}`} fill={d.color} />
                          ))}
                        </Bar>
                      </BarChart>
                    </ResponsiveContainer>
                  </div>
                )}
              </div>
            </div>

            {/* Methodology Explanation */}
            <div className="bg-card/40 border border-border/60 rounded-lg p-5 mt-6 flex gap-3 text-xs leading-relaxed col-span-5">
              <div className="text-primary mt-0.5"><Icon name="info" className="w-4 h-4" /></div>
              <div>
                <h4 className="font-bold text-foreground mb-1">Methodology Overview: Cost Build-Up Model</h4>
                <p className="text-muted-foreground">
                  This page calculates the fully loaded unit cost of production. In <strong>Detailed Mode</strong>, materials are aggregated from the custom Bill of Materials (BOM), and labor is calculated from operational steps. Overhead includes machine rates and facility allocations. Tooling Capex is amortized over amortization years and volume: Tooling CPU = Tooling Investment / (Amortization Years * Volume). Yield loss and scrap disposal are computed using the multiplier (1 / Yield Rate) - 1, applying cost burden to the raw materials lost during manufacturing rejects.
                </p>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────────────────────
    // Solver Component (3 Tabs: Breakeven, Monte Carlo, Sensitivity Matrix)
    // ─────────────────────────────────────────────────────────────────────────

    const SOLVE_VARIABLES = {
      simple: ["materialsSimple", "laborSimple", "overheadSimple", "sellingPrice"],
      standard: ["materialsStandard", "laborHoursStandard", "laborRateStandard", "overheadRateStandard", "toolingCost", "annualVolume", "yieldRate", "sellingPrice"],
      detailed: ["laborHoursStandard", "laborRateStandard", "toolingCost", "annualVolume", "yieldRate", "sellingPrice"]
    };

    const SOLVE_VARIABLE_LABELS = {
      materialsSimple: "Materials Cost / Unit",
      laborSimple: "Labor Cost / Unit",
      overheadSimple: "Overhead Cost / Unit",
      materialsStandard: "Material Standard Cost",
      laborHoursStandard: "Labor Hours / Unit",
      laborRateStandard: "Labor Rate ($/hr)",
      overheadRateStandard: "Overhead Burden Rate",
      toolingCost: "Tooling Investment ($)",
      annualVolume: "Annual Production Volume",
      yieldRate: "First Pass Yield Rate (%)",
      packagingCost: "Packaging cost / unit",
      logisticsInbound: "Inbound logistics / unit",
      logisticsOutbound: "Outbound logistics / unit",
      warrantyProvisionPercent: "Warranty provision %",
      sellingPrice: "Selling Price (ASP)"
    };

    function getCurrentValue(variable, config, inputs) {
      switch (variable) {
        case "materialsSimple": return inputs.materialsSimple;
        case "laborSimple": return inputs.laborSimple;
        case "overheadSimple": return inputs.overheadSimple;
        case "materialsStandard": return inputs.materialsStandard;
        case "laborHoursStandard": return inputs.laborHoursStandard;
        case "laborRateStandard": return inputs.laborRateStandard;
        case "overheadRateStandard": return inputs.overheadRateStandard;
        case "toolingCost": return inputs.toolingCost;
        case "annualVolume": return config.annualVolume;
        case "yieldRate": return inputs.yieldRate * 100;
        case "sellingPrice": return config.sellingPrice;
        default: return 0;
      }
    }

    function formatValue(variable, value) {
      if (variable === "annualVolume") return `${Math.round(value).toLocaleString()} units`;
      if (variable === "yieldRate") return `${value.toFixed(1)}%`;
      if (variable === "toolingCost") return formatLargeMoney(value);
      if (variable === "laborHoursStandard") return `${value.toFixed(2)} hrs`;
      return `$${formatNumber(value)}`;
    }

    function SolverPage({ activeScenario }) {
      const [tab, setTab] = useState("breakeven"); // breakeven, montecarlo, sensitivity
      const { config, inputs } = activeScenario;
      const current = calculateCosts(config, inputs);

      // Tab 1 (Breakeven) states
      const [goalType, setGoalType] = useState("target_cpu");
      const [targetCPU, setTargetCPU] = useState(current.totalCost * 0.9);
      const [targetMargin, setTargetMargin] = useState(40);
      const [investmentAmount, setInvestmentAmount] = useState(500000);
      const [paybackYears, setPaybackYears] = useState(3);
      const [selectedVar, setSelectedVar] = useState(SOLVE_VARIABLES[config.granularity][0]);

      // Tab 2 (Monte Carlo) states
      const [mcRuns, setMcRuns] = useState(5000);
      const [mcTarget, setMcTarget] = useState(current.totalCost * 0.9);
      const [runSim, setRunSim] = useState(false);
      const [mcResult, setMcResult] = useState(null);

      // Tab 3 (Sensitivity Grid) states
      const [gridRowVar, setGridRowVar] = useState("sellingPrice");
      const [gridColVar, setGridColVar] = useState(SOLVE_VARIABLES[config.granularity][0]);
      const [gridMetric, setGridMetric] = useState("grossMarginPercent");
      const [gridRangePct, setGridRangePct] = useState(20);

      const availableVars = SOLVE_VARIABLES[config.granularity];

      // Breakeven results
      const breakevenGoal = {
        type: goalType,
        targetCPU: goalType === "target_cpu" ? parseFloat(targetCPU) || 0 : undefined,
        targetMarginPercent: goalType === "target_margin" ? parseFloat(targetMargin) || 0 : undefined,
        investmentAmount: goalType === "investment_payback" ? parseFloat(investmentAmount) || 0 : undefined,
        paybackYears: goalType === "investment_payback" ? parseFloat(paybackYears) || 3 : undefined,
      };
      const breakevenResult = solveForVariable(config, inputs, selectedVar, breakevenGoal);

      // Generate Volume Sensitivity
      const sensitivityMultipliers = [0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0];
      const sensitivityData = sensitivityMultipliers.map(mult => {
        const testConfig = { ...config, annualVolume: Math.round(config.annualVolume * mult) };
        const res = solveForVariable(testConfig, inputs, selectedVar, breakevenGoal);
        return {
          volume: `${(mult * 100).toFixed(0)}%`,
          required: res?.feasible ? parseFloat(res.solvedValue.toFixed(4)) : null,
          current: getCurrentValue(selectedVar, config, inputs)
        };
      });

      // Monte Carlo Simulation Engine run
      const executeMonteCarlo = () => {
        setRunSim(true);
        setTimeout(() => {
          const runResults = [];
          const marginResults = [];
          for (let i = 0; i < mcRuns; i++) {
            // Apply simple +-10% uniform variation to key drivers
            const tempInputs = { ...inputs };
            let tempASP = config.sellingPrice;

            if (config.granularity === "simple") {
              tempInputs.materialsSimple = inputs.materialsSimple * (1 + (Math.random() * 0.2 - 0.1));
              tempInputs.laborSimple = inputs.laborSimple * (1 + (Math.random() * 0.16 - 0.08));
            } else {
              tempInputs.materialsStandard = inputs.materialsStandard * (1 + (Math.random() * 0.2 - 0.1));
              tempInputs.laborHoursStandard = inputs.laborHoursStandard * (1 + (Math.random() * 0.2 - 0.08));
              tempInputs.yieldRate = Math.min(1, Math.max(0.8, inputs.yieldRate * (1 + (Math.random() * 0.06 - 0.04))));
            }

            const bd = calculateCosts(config, tempInputs);
            runResults.push(bd.totalCost);
            marginResults.push(bd.grossMarginPercent);
          }

          runResults.sort((a, b) => a - b);
          marginResults.sort((a, b) => a - b);

          const sum = runResults.reduce((a, b) => a + b, 0);
          const mean = sum / mcRuns;
          const variance = runResults.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / mcRuns;
          const stdDev = Math.sqrt(variance);

          const p10 = runResults[Math.floor(mcRuns * 0.1)];
          const p50 = runResults[Math.floor(mcRuns * 0.5)];
          const p90 = runResults[Math.floor(mcRuns * 0.9)];

          const belowTargetCount = runResults.filter(v => v <= mcTarget).length;
          const prob = belowTargetCount / mcRuns;

          // Histogram builder (20 bins)
          const min = runResults[0];
          const max = runResults[runResults.length - 1];
          const binWidth = (max - min) / 20;
          const bins = Array.from({ length: 20 }, (_, idx) => {
            const low = min + idx * binWidth;
            const high = low + binWidth;
            const count = runResults.filter(v => v >= low && v < high).length;
            return {
              binMid: low + binWidth / 2,
              pct: count / mcRuns,
            };
          });

          setMcResult({
            p10, p50, p90, mean, stdDev, prob, bins
          });
          setRunSim(false);
        }, 50);
      };

      // 2D Sensitivity Grid generation
      const gridBaseRowVal = getCurrentValue(gridRowVar, config, inputs);
      const gridBaseColVal = getCurrentValue(gridColVar, config, inputs);
      const gridSteps = [-3, -2, -1, 0, 1, 2, 3].map(s => (s * gridRangePct) / 3);

      const gridData = useMemo(() => {
        if (gridRowVar === gridColVar) return [];
        return gridSteps.map(rPct => {
          const rowVal = gridBaseRowVal * (1 + rPct / 100);
          const cols = gridSteps.map(cPct => {
            const colVal = gridBaseColVal * (1 + cPct / 100);
            const step1 = overrideVariable(config, inputs, gridRowVar, rowVal);
            const step2 = overrideVariable(step1.config, step1.inputs, gridColVar, colVal);
            const bd = calculateCosts(step2.config, step2.inputs);

            let value = 0;
            if (gridMetric === "grossMarginPercent") value = bd.grossMarginPercent * 100;
            else if (gridMetric === "grossMargin") value = bd.grossMargin;
            else if (gridMetric === "totalCost") value = bd.totalCost;
            else if (gridMetric === "annualProfit") value = bd.grossMargin * step2.config.annualVolume;

            return { cPct, value };
          });
          return { rPct, rowVal, cols };
        });
      }, [gridRowVar, gridColVar, gridMetric, gridRangePct, gridBaseRowVal, gridBaseColVal, config, inputs]);

      return (
        <div className="space-y-6 animate-[fadeIn_0.2s_ease-out]">
          <div className="flex items-center justify-between">
            <div>
              <h1 className="text-2xl font-bold tracking-tight">Solver & Sensitivity Page</h1>
              <p className="text-xs text-muted-foreground mt-1">Determine drivers, run probability risk runs, or solve 2D crossover margins.</p>
            </div>

            {/* Navigation Tabs */}
            <div className="flex border-b border-border">
              {[
                { id: "breakeven", label: "Breakeven Solver", icon: "target" },
                { id: "montecarlo", label: "Monte Carlo Risk", icon: "dices" },
                { id: "sensitivity", label: "2D Sensitivity Grid", icon: "layers" }
              ].map(t => (
                <button
                  key={t.id}
                  onClick={() => setTab(t.id)}
                  className={`flex items-center gap-2 px-5 py-3 border-b-2 font-semibold text-xs transition-colors cursor-pointer -mb-px ${
                    tab === t.id ? "border-primary text-primary" : "border-transparent text-muted-foreground hover:text-foreground"
                  }`}
                >
                  <Icon name={t.icon} className="w-3.5 h-3.5" />
                  {t.label}
                </button>
              ))}
            </div>
          </div>

          {/* TAB 1: Breakeven Solver */}
          {tab === "breakeven" && (
            <div className="grid grid-cols-5 gap-6">
              {/* Left Config Panel */}
              <div className="col-span-2 space-y-4">
                <div className="bg-card border border-card-border rounded-lg p-5 space-y-4">
                  <h3 className="text-xs font-semibold uppercase tracking-wider text-muted-foreground">Select Goal</h3>
                  <div className="space-y-2">
                    {[
                      { id: "target_cpu", label: "Target Cost Per Unit", desc: "Solve for driver to reach a specific overall CPU." },
                      { id: "target_margin", label: "Target Gross Margin %", desc: "Solve for driver to hit a specific profit margin." },
                      { id: "investment_payback", label: "Investment Payback", desc: "Evaluate required cost saving for an upfront Capex." }
                    ].map(g => (
                      <button
                        key={g.id}
                        onClick={() => setGoalType(g.id)}
                        className={`w-full text-left rounded border p-3 transition-colors ${
                          goalType === g.id ? "border-primary bg-primary/10" : "border-border hover:bg-muted/20"
                        }`}
                      >
                        <div className="font-bold text-xs text-foreground">{g.label}</div>
                        <div className="text-[10px] text-muted-foreground mt-0.5">{g.desc}</div>
                      </button>
                    ))}
                  </div>

                  <div className="border-t border-border/40 pt-4">
                    {goalType === "target_cpu" && (
                      <div>
                        <label className="text-[10px] text-muted-foreground block mb-1 uppercase font-semibold">Target CPU (Current: ${formatNumber(current.totalCost)})</label>
                        <input type="number" value={targetCPU} onChange={e => setTargetCPU(e.target.value)} className="w-full bg-input/20 border border-border rounded px-3 py-1.5 text-xs outline-none text-right font-mono" />
                      </div>
                    )}
                    {goalType === "target_margin" && (
                      <div>
                        <label className="text-[10px] text-muted-foreground block mb-1 uppercase font-semibold">Target Margin % (Current: {(current.grossMarginPercent * 100).toFixed(1)}%)</label>
                        <input type="number" value={targetMargin} onChange={e => setTargetMargin(e.target.value)} className="w-full bg-input/20 border border-border rounded px-3 py-1.5 text-xs outline-none text-right font-mono" />
                      </div>
                    )}
                    {goalType === "investment_payback" && (
                      <div className="space-y-3">
                        <div>
                          <label className="text-[10px] text-muted-foreground block mb-1 uppercase font-semibold">Investment Amount ($)</label>
                          <input type="number" value={investmentAmount} onChange={e => setInvestmentAmount(e.target.value)} className="w-full bg-input/20 border border-border rounded px-3 py-1.5 text-xs outline-none text-right font-mono" />
                        </div>
                        <div>
                          <label className="text-[10px] text-muted-foreground block mb-1 uppercase font-semibold">Target Payback period (years)</label>
                          <input type="number" value={paybackYears} onChange={e => setPaybackYears(e.target.value)} className="w-full bg-input/20 border border-border rounded px-3 py-1.5 text-xs outline-none text-right font-mono" />
                        </div>
                      </div>
                    )}
                  </div>
                </div>

                <div className="bg-card border border-card-border rounded-lg p-5">
                  <h3 className="text-xs font-semibold uppercase tracking-wider text-muted-foreground mb-3">Variable to Solve</h3>
                  <select value={selectedVar} onChange={e => setSelectedVar(e.target.value)} className="w-full bg-input/20 border border-border rounded px-3 py-2 text-xs outline-none focus:ring-1 focus:ring-ring">
                    {availableVars.map(v => (
                      <option key={v} value={v} className="bg-card text-foreground">{SOLVE_VARIABLE_LABELS[v]}</option>
                    ))}
                  </select>
                  <div className="text-[10px] text-muted-foreground mt-2">Current Value: <span className="font-mono text-foreground">{formatValue(selectedVar, getCurrentValue(selectedVar, config, inputs))}</span></div>
                </div>
              </div>

              {/* Right Result Panel */}
              <div className="col-span-3 space-y-4">
                {breakevenResult && (
                  <>
                    <div className={`rounded-lg border p-5 ${breakevenResult.feasible ? "border-primary bg-primary/5" : "border-red-400/30 bg-red-400/5"}`}>
                      <h4 className="text-xs font-semibold uppercase text-muted-foreground mb-2">Required {SOLVE_VARIABLE_LABELS[selectedVar]}</h4>
                      <div className="flex items-baseline gap-3">
                        <span className="text-3xl font-extrabold text-primary">{breakevenResult.feasible ? formatValue(selectedVar, breakevenResult.solvedValue) : "Unachievable"}</span>
                        {breakevenResult.feasible && (
                          <span className={`text-xs font-bold ${breakevenResult.delta > 0 ? "text-green-400" : "text-red-400"}`}>
                            {breakevenResult.delta < 0 ? "▼" : "▲"} {Math.abs(breakevenResult.deltaPercent).toFixed(1)}%
                          </span>
                        )}
                      </div>
                      <p className="text-xs text-muted-foreground mt-2">{breakevenResult.message}</p>
                    </div>

                    <div className="bg-card border border-card-border rounded-lg p-5">
                      <h3 className="text-xs font-semibold uppercase tracking-wider text-muted-foreground mb-3">Volume Sensitivity (1D sweep)</h3>
                      <div className="h-44">
                        <ResponsiveContainer width="100%" height="100%">
                          <LineChart data={sensitivityData}>
                            <XAxis dataKey="volume" tick={{ fontSize: 10, fill: "hsl(210,14%,52%)" }} />
                            <YAxis tick={{ fontSize: 10, fill: "hsl(210,14%,52%)" }} />
                            <Tooltip contentStyle={{ background: "hsl(222,26%,12%)", border: "1px solid hsl(222,20%,18%)" }} />
                            <Line type="monotone" dataKey="required" stroke="hsl(210,90%,56%)" strokeWidth={2} name="Required" />
                            <Line type="monotone" dataKey="current" stroke="hsl(38,90%,52%)" strokeDasharray="3 3" name="Current Base" />
                          </LineChart>
                        </ResponsiveContainer>
                      </div>
                    </div>
                  </>
                )}
              </div>
            </div>
          )}

          {/* TAB 2: Monte Carlo Simulation */}
          {tab === "montecarlo" && (
            <div className="grid grid-cols-5 gap-6">
              {/* Config Panel */}
              <div className="col-span-2 space-y-4">
                <div className="bg-card border border-card-border rounded-lg p-5 space-y-4">
                  <h3 className="text-xs font-semibold uppercase tracking-wider text-muted-foreground">Simulation Bounds</h3>
                  <p className="text-[10px] text-muted-foreground">Randomly sweeps direct inputs by ±10% to generate probability distributions.</p>
                  <div>
                    <label className="text-[10px] text-muted-foreground block mb-1 font-semibold uppercase">Number of runs</label>
                    <select value={mcRuns} onChange={e => setMcRuns(parseInt(e.target.value))} className="w-full bg-input/20 border border-border rounded px-3 py-2 text-xs outline-none">
                      <option value="1000" className="bg-card">1,000 runs</option>
                      <option value="5000" className="bg-card">5,000 runs</option>
                      <option value="10000" className="bg-card">10,000 runs</option>
                    </select>
                  </div>
                  <div>
                    <label className="text-[10px] text-muted-foreground block mb-1 font-semibold uppercase">Target CPU Bound ($)</label>
                    <input type="number" value={mcTarget} onChange={e => setMcTarget(parseFloat(e.target.value) || 0)} className="w-full bg-input/20 border border-border rounded px-3 py-1.5 text-xs outline-none text-right font-mono" />
                  </div>
                  <button
                    onClick={executeMonteCarlo}
                    disabled={runSim}
                    className="w-full flex items-center justify-center gap-2 bg-primary text-primary-foreground py-2 rounded-md font-semibold text-xs hover:opacity-90 transition-opacity disabled:opacity-40 cursor-pointer"
                  >
                    <Icon name="play" className="w-3.5 h-3.5 fill-current" />
                    {runSim ? "Running..." : "Run Monte Carlo"}
                  </button>
                </div>
              </div>

              {/* Right Output Panel */}
              <div className="col-span-3 space-y-4">
                {mcResult ? (
                  <>
                    <div className="grid grid-cols-3 gap-3">
                      <div className="bg-card border border-card-border rounded-lg p-4">
                        <div className="text-[10px] text-muted-foreground uppercase tracking-wider mb-0.5">Median CPU (P50)</div>
                        <div className="text-lg font-bold text-primary">${formatNumber(mcResult.p50)}</div>
                      </div>
                      <div className="bg-card border border-card-border rounded-lg p-4">
                        <div className="text-[10px] text-muted-foreground uppercase tracking-wider mb-0.5">Confidence (P90)</div>
                        <div className="text-lg font-bold text-foreground">${formatNumber(mcResult.p90)}</div>
                      </div>
                      <div className="bg-card border border-card-border rounded-lg p-4">
                        <div className="text-[10px] text-muted-foreground uppercase tracking-wider mb-0.5">Prob. of Target</div>
                        <div className={`text-lg font-bold ${mcResult.prob >= 0.5 ? "text-green-400" : "text-yellow-400"}`}>
                          {(mcResult.prob * 100).toFixed(1)}%
                        </div>
                      </div>
                    </div>

                    <div className="bg-card border border-card-border rounded-lg p-5">
                      <h3 className="text-xs font-semibold uppercase tracking-wider text-muted-foreground mb-3">CPU Distribution</h3>
                      <div className="h-44">
                        <ResponsiveContainer width="100%" height="100%">
                          <BarChart data={mcResult.bins} barCategoryGap={1}>
                            <XAxis dataKey="binMid" tickFormatter={v => `$${v.toFixed(0)}`} tick={{ fontSize: 10, fill: "hsl(210,14%,52%)" }} />
                            <YAxis tickFormatter={v => `${(v * 100).toFixed(0)}%`} tick={{ fontSize: 10, fill: "hsl(210,14%,52%)" }} />
                            <Tooltip formatter={v => [`${(v * 100).toFixed(1)}%`, "Density"]} contentStyle={{ background: "hsl(222,26%,12%)", border: "1px solid hsl(222,20%,18%)" }} />
                            <Bar dataKey="pct" fill="hsl(210,90%,56%)" opacity={0.8} />
                          </BarChart>
                        </ResponsiveContainer>
                      </div>
                    </div>
                  </>
                ) : (
                  <div className="bg-card border border-card-border rounded-lg p-10 text-center text-xs text-muted-foreground flex flex-col items-center gap-3">
                    <Icon name="dices" className="w-8 h-8 text-muted-foreground/30" />
                    <span>Run simulation to display probability distributions and tails.</span>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* TAB 3: 2D Sensitivity Matrix Grid */}
          {tab === "sensitivity" && (
            <div className="space-y-6">
              <div className="bg-card border border-card-border rounded-lg p-5">
                <h3 className="text-xs font-semibold uppercase tracking-wider text-muted-foreground mb-3">Matrix Drivers</h3>
                <div className="grid grid-cols-4 gap-4">
                  <div>
                    <label className="text-[10px] text-muted-foreground block mb-1 uppercase font-semibold">Row Driver (Y-Axis)</label>
                    <select value={gridRowVar} onChange={e => setGridRowVar(e.target.value)} className="w-full bg-input/20 border border-border rounded px-3 py-1.5 text-xs outline-none">
                      {availableVars.map(v => (
                        <option key={`row-var-${v}`} value={v} className="bg-card text-foreground">{SOLVE_VARIABLE_LABELS[v]}</option>
                      ))}
                    </select>
                  </div>
                  <div>
                    <label className="text-[10px] text-muted-foreground block mb-1 uppercase font-semibold">Col Driver (X-Axis)</label>
                    <select value={gridColVar} onChange={e => setGridColVar(e.target.value)} className="w-full bg-input/20 border border-border rounded px-3 py-1.5 text-xs outline-none">
                      {availableVars.map(v => (
                        <option key={`col-var-${v}`} value={v} className="bg-card text-foreground">{SOLVE_VARIABLE_LABELS[v]}</option>
                      ))}
                    </select>
                  </div>
                  <div>
                    <label className="text-[10px] text-muted-foreground block mb-1 uppercase font-semibold">Output Metric</label>
                    <select value={gridMetric} onChange={e => setGridMetric(e.target.value)} className="w-full bg-input/20 border border-border rounded px-3 py-1.5 text-xs outline-none">
                      <option value="grossMarginPercent" className="bg-card text-foreground">Gross Margin %</option>
                      <option value="grossMargin" className="bg-card text-foreground">Gross Margin ($)</option>
                      <option value="totalCost" className="bg-card text-foreground">Total Cost (CPU)</option>
                      <option value="annualProfit" className="bg-card text-foreground">Annual Profit ($)</option>
                    </select>
                  </div>
                  <div>
                    <label className="text-[10px] text-muted-foreground block mb-1 uppercase font-semibold">Step bounds (±%)</label>
                    <select value={gridRangePct} onChange={e => setGridRangePct(parseInt(e.target.value) || 20)} className="w-full bg-input/20 border border-border rounded px-3 py-1.5 text-xs outline-none">
                      <option value="10" className="bg-card">± 10%</option>
                      <option value="20" className="bg-card">± 20%</option>
                      <option value="30" className="bg-card">± 30%</option>
                    </select>
                  </div>
                </div>
              </div>

              {gridRowVar !== gridColVar ? (
                <div className="bg-card border border-card-border rounded-lg p-5 overflow-auto">
                  <div className="min-w-[800px]">
                    <h3 className="text-xs font-semibold uppercase tracking-wider text-muted-foreground mb-4">Cross-Variable Heatmap Table</h3>
                    <table className="w-full border-collapse text-center text-xs">
                      <thead>
                        <tr>
                          <th className="bg-transparent border-0 w-40" />
                          <th colSpan={7} className="text-xs font-bold text-primary pb-2 uppercase tracking-wider">{SOLVE_VARIABLE_LABELS[gridColVar]}</th>
                        </tr>
                        <tr className="border-b border-border bg-muted/10">
                          <th className="text-left py-2 px-3 text-muted-foreground font-semibold">{SOLVE_VARIABLE_LABELS[gridRowVar]}</th>
                          {gridSteps.map(cPct => (
                            <th key={`grid-col-pct-${cPct}`} className="py-2 px-1 text-foreground font-semibold">
                              <div>{cPct > 0 ? "+" : ""}{cPct.toFixed(1)}%</div>
                              <div className="text-[10px] text-muted-foreground mt-0.5 font-normal">{formatValue(gridColVar, gridBaseColVal * (1 + cPct / 100))}</div>
                            </th>
                          ))}
                        </tr>
                      </thead>
                      <tbody>
                        {gridData.map(({ rPct, rowVal, cols }) => (
                          <tr key={`grid-row-${rPct}`} className="border-b border-border/40 hover:bg-muted/5 transition-colors">
                            <td className="text-left py-3 px-3 font-semibold text-foreground">
                              <span className="text-muted-foreground w-12 inline-block">{rPct > 0 ? "+" : ""}{rPct.toFixed(1)}%</span>
                              <span>{formatValue(gridRowVar, rowVal)}</span>
                            </td>
                            {cols.map(({ cPct, value }) => {
                              const isCenter = Math.abs(rPct) < 0.01 && Math.abs(cPct) < 0.01;
                              let bg = "transparent";

                              // Coloring logic based on metric and value
                              if (gridMetric === "totalCost") {
                                const diffPct = ((value - current.totalCost) / current.totalCost) * 100;
                                if (diffPct < -0.1) bg = `rgba(74, 222, 128, ${Math.min(0.8, Math.abs(diffPct) / 25)})`;
                                else if (diffPct > 0.1) bg = `rgba(248, 113, 113, ${Math.min(0.8, diffPct / 25)})`;
                              } else {
                                let baseVal = current.grossMarginPercent * 100;
                                if (gridMetric === "grossMargin") baseVal = current.grossMargin;
                                else if (gridMetric === "annualProfit") baseVal = current.grossMargin * config.annualVolume;

                                if (value < 0) bg = `rgba(248, 113, 113, ${0.3 + Math.min(0.6, Math.abs(value) / (baseVal || 100))})`;
                                else {
                                  const diffPct = ((value - baseVal) / (Math.abs(baseVal) || 1)) * 100;
                                  if (diffPct > 0.1) bg = `rgba(74, 222, 128, ${Math.min(0.8, diffPct / 30)})`;
                                  else if (diffPct < -0.1) bg = `rgba(248, 113, 113, ${Math.min(0.8, Math.abs(diffPct) / 30)})`;
                                }
                              }

                              const cellDisplay = gridMetric === "grossMarginPercent" ? `${value.toFixed(1)}%` : gridMetric === "annualProfit" ? formatLargeMoney(value) : `$${formatNumber(value)}`;

                              return (
                                <td
                                  key={`cell-${rPct}-${cPct}`}
                                  style={{ backgroundColor: bg }}
                                  className={`py-3 px-1 font-bold stat-value text-foreground/90 ${
                                    isCenter ? "outline outline-2 outline-primary outline-offset-[-2px] bg-primary/10 shadow-lg font-extrabold" : ""
                                  }`}
                                >
                                  {cellDisplay}
                                </td>
                              );
                            })}
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              ) : (
                <div className="bg-card border border-card-border rounded-lg p-10 text-center text-xs text-muted-foreground">Select two different drivers to view the cross-variable matrix heatmap.</div>
              )}
            </div>
          )}

          {/* Methodology Explanation */}
          <div className="bg-card/40 border border-border/60 rounded-lg p-5 mt-6 flex gap-3 text-xs leading-relaxed">
            <div className="text-primary mt-0.5"><Icon name="info" className="w-4 h-4" /></div>
            {tab === "breakeven" && (
              <div>
                <h4 className="font-bold text-foreground mb-1">Methodology: Breakeven Solver</h4>
                <p className="text-muted-foreground">
                  The solver uses algebraic goal-seeking. It establishes a target Cost Per Unit (CPU) based on your target (e.g. Target CPU directly, or derived from Target Margin as ASP * (1 - Margin % / 100)). For Capex Payback, it solves for the required unit savings needed to recoup the investment over the payback target: Target CPU = Current CPU - Investment / (Volume * Payback Years). It then sets the target cost equations equal to the cost build-up and back-calculates the required value for the selected driver.
                </p>
              </div>
            )}
            {tab === "montecarlo" && (
              <div>
                <h4 className="font-bold text-foreground mb-1">Methodology: Monte Carlo Risk Simulation</h4>
                <p className="text-muted-foreground">
                  This tool runs 5,000+ randomized trials (runs) of your unit cost model. During each run, direct variables (such as materials costs, labor hours, and yield rates) are randomly fluctuated within a uniform ±10% variation range. The results are aggregated, sorted, and bucketed into a histogram. <strong>P50 (Median)</strong> represents the 50% probability threshold, while <strong>P90</strong> represents the 90% confidence threshold (meaning costs will be at or below this value 90% of the time).
                </p>
              </div>
            )}
            {tab === "sensitivity" && (
              <div>
                <h4 className="font-bold text-foreground mb-1">Methodology: 2D Sensitivity Grid</h4>
                <p className="text-muted-foreground">
                  The sensitivity matrix sweeps two independent variables (Row and Column drivers) simultaneously through a range of ±% steps relative to their current baseline value. For each cell intersection, it recalculates the entire cost build-up and measures the selected output metric (such as Gross Margin % or total CPU). Better-than-baseline cells are highlighted in green, worse cells in red, and the center represents your current baseline model.
                </p>
              </div>
            )}
          </div>
        </div>
      );
    }
